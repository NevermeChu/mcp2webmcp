<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebMCP Gateway</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon-32.png" alt="Logo" class="brand-icon" />
        <span class="brand-title">WebMCP Gateway</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <button type="button" id="lang-toggle-btn" class="btn" style="padding: 2px 7px; font-size: 11px; height: 24px;" title="切换语言 / Switch Language">EN</button>
        <div id="status-pill" class="status-pill">
          <span class="status-dot"></span>
          <span id="status-text">检查中…</span>
        </div>
      </div>
    </header>

    <!-- Offline Alert Banner -->
    <div id="offline-banner" class="offline-banner" hidden>
      <div class="offline-title">
        <span data-i18n="gateway_offline_title">网关未连接</span>
        <button type="button" id="reconnect-btn" class="btn btn-icon" style="padding: 2px 6px; font-size: 11px;" data-i18n="reconnect_btn">
          重新连接
        </button>
      </div>
      <div data-i18n="gateway_offline_hint">请确保本机 Gateway 服务正在运行：</div>
      <div class="cmd-box">
        <span id="cmd-text">node apps/gateway/dist/main.js</span>
        <button type="button" id="copy-cmd-btn" class="copy-btn" title="Copy command" data-i18n="copy">复制</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <button type="button" id="register-tool" class="btn btn-primary" data-i18n="register_tool">
        ✨ 拾取页面元素生成工具
      </button>
      <button type="button" id="refresh-btn" class="btn btn-icon" title="刷新状态">
        ⟳
      </button>
    </div>

    <div id="pick-error" class="offline-banner" style="margin-bottom: 12px;" hidden></div>

    <!-- Active Tab Panel -->
    <div class="card">
      <div class="card-header">
        <span class="card-title" data-i18n="active_tab">当前页面</span>
        <span id="active-tools-count" class="pill" style="background: var(--bg-subtle); color: var(--text-muted);">0 个工具</span>
      </div>
      <div id="active-tab-title" class="active-tab-title">加载中…</div>
      <div class="active-tab-meta">
        <span id="active-tab-origin" class="origin-badge">about:blank</span>
        <span id="active-tab-runtime" class="pill">检查运行时…</span>
      </div>

      <!-- Active Tools List -->
      <div class="section-title">
        <span data-i18n="page_tools_title">页面已暴露工具</span>
      </div>
      <div id="tools-container" class="tools-list">
        <div class="empty-state">当前页面暂无注册工具。</div>
      </div>
    </div>

    <!-- Live Activity / Invocations Stream -->
    <div class="card">
      <div class="card-header">
        <span class="card-title" data-i18n="live_invocations">实时调用记录</span>
        <span id="inv-count" class="pill" style="background: var(--bg-subtle); color: var(--text-muted);">0 次调用</span>
      </div>
      <div id="invocations-container" class="invocations-list">
        <div class="empty-state">等待 AI Agent 调用页面工具…</div>
      </div>
    </div>

    <!-- Other Tabs -->
    <details id="other-tabs-details" style="margin-top: 10px;">
      <summary style="font-size: 11px; font-weight: 700; color: var(--text-muted); cursor: pointer; text-transform: uppercase;">
        <span data-i18n="other_tabs">其他 WebMCP 标签页</span> (<span id="other-tabs-count">0</span>)
      </summary>
      <div id="other-tabs-container" class="other-tabs-list" style="margin-top: 8px;">
        <div class="empty-state" style="padding: 8px;">无其他打开的 WebMCP 页面。</div>
      </div>
    </details>

    <script src="sidepanel.js"></script>
  </body>
</html>
