<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebMCP Gateway</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon-32.png" alt="" class="brand-icon" />
          <div class="brand-copy">
            <div class="brand-title">WebMCP Gateway</div>
            <div class="brand-subtitle">Browser tools, locally bridged</div>
          </div>
        </div>
        <div class="top-actions">
          <button
            type="button"
            id="lang-toggle-btn"
            class="quiet-btn"
            title="切换语言 / Switch Language"
          >
            EN
          </button>
          <div id="status-pill" class="status-pill">
            <span class="status-dot"></span
            ><span id="status-text" data-i18n="status_checking">检查中…</span>
          </div>
          <button
            type="button"
            id="refresh-btn"
            class="icon-btn"
            title="刷新状态"
            aria-label="刷新状态"
          >
            ⟳
          </button>
        </div>
      </header>

      <div class="scroll-area">
        <div class="content">
          <section id="offline-banner" class="offline-banner" hidden>
            <div class="offline-heading">
              <div>
                <strong data-i18n="gateway_offline_title">网关未连接</strong>
                <p data-i18n="gateway_offline_hint">请确保本机 Gateway 服务正在运行：</p>
              </div>
              <button
                type="button"
                id="reconnect-btn"
                class="secondary-btn"
                data-i18n="reconnect_btn"
              >
                重新连接
              </button>
            </div>
            <div class="cmd-box">
              <code id="cmd-text">node apps/gateway/dist/main.js</code
              ><button type="button" id="copy-cmd-btn" class="copy-btn" data-i18n="copy">
                复制
              </button>
            </div>
          </section>
          <div id="pick-error" class="inline-error" hidden></div>
          <section id="confirmations-panel" class="confirmations-panel" hidden>
            <div class="confirmation-heading" data-i18n="confirmation_heading">等待确认</div>
            <div id="confirmations-container"></div>
          </section>

          <section class="page-card">
            <div class="page-kicker-row">
              <span class="eyebrow" data-i18n="active_tab">当前页面</span
              ><span id="active-tab-runtime" class="runtime-state" data-i18n="runtime_inactive"
                >未激活</span
              >
            </div>
            <h1 id="active-tab-title" class="active-tab-title" data-i18n="loading">加载中…</h1>
            <div id="active-tab-origin" class="origin-text">about:blank</div>
            <div class="summary-row">
              <div class="metric">
                <strong id="active-tools-count">0</strong
                ><span data-i18n="metric_tools">可用工具</span>
              </div>
              <div class="metric">
                <strong id="inv-count">0</strong><span data-i18n="metric_calls">最近调用</span>
              </div>
              <button
                type="button"
                id="register-tool"
                class="primary-btn"
                data-i18n="register_tool"
              >
                ＋ 从页面创建
              </button>
            </div>
          </section>

          <nav class="view-tabs" aria-label="Content view">
            <button type="button" class="view-tab active" data-view="tools">
              <span data-i18n="tools_tab">工具</span
              ><span id="tools-tab-count" class="tab-count">0</span>
            </button>
            <button type="button" class="view-tab" data-view="activity">
              <span data-i18n="activity_tab">活动</span
              ><span id="activity-tab-count" class="tab-count">0</span>
            </button>
          </nav>
          <section id="tools-view" class="panel-view">
            <div id="tools-container" class="tools-list">
              <div class="empty-state" data-i18n="empty_tools_short">当前页面暂无注册工具。</div>
            </div>
          </section>
          <section id="activity-view" class="panel-view" hidden>
            <div id="invocations-container" class="invocations-list">
              <div class="empty-state" data-i18n="waiting_invocations">
                等待 AI Agent 调用页面工具…
              </div>
            </div>
          </section>

          <section class="other-tabs-section">
            <button
              type="button"
              id="other-tabs-toggle"
              class="section-toggle"
              aria-expanded="true"
            >
              <span data-i18n="other_tabs">其他 WebMCP 标签页</span
              ><span class="section-meta"
                ><span id="other-tabs-count">0</span><span class="toggle-chevron">⌄</span></span
              >
            </button>
            <div id="other-tabs-container" class="other-tabs-list">
              <div class="empty-state compact" data-i18n="no_other_tabs">
                无其他打开的 WebMCP 页面。
              </div>
            </div>
          </section>
        </div>
      </div>

      <section id="auth-settings" class="settings-panel" hidden>
        <div class="settings-title" data-i18n="auth_settings">Gateway 鉴权令牌</div>
        <p data-i18n="auth_hint">必填；须与 Gateway 配置中的共享令牌一致。</p>
        <div class="token-row">
          <input
            id="auth-token-input"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="browser.extension.authToken"
          /><button type="button" id="auth-token-save" class="save-btn" data-i18n="save">
            保存</button
          ><button type="button" id="auth-token-clear" class="clear-btn" data-i18n="clear">
            清除
          </button>
        </div>
        <span id="auth-token-status" class="token-status"></span>
      </section>
      <footer class="footer-bar">
        <span class="local-note"
          >◯ <span data-i18n="local_only">仅连接本机</span> 127.0.0.1:9334</span
        ><button
          type="button"
          id="auth-settings-toggle"
          class="footer-action"
          data-i18n="connection_settings"
        >
          连接设置
        </button>
      </footer>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
