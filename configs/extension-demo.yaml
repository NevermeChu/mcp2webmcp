# WebMCP Gateway extension demo (no MCP-B embed).
# Load the unpacked MV3 extension from apps/extension.
# Empty allowedOrigins: every origin the extension discovers is admitted.
# Registered tools are auto-admitted. Users can switch each tool to allow,
# confirm, or deny in the Side Panel; consent revoke remains available to MCP.
# 9334 is the extension loopback; do not use 9333 (MCP-B relay).
# Set MCP2WEBMCP_EXTENSION_TOKEN before startup and paste the same token into
# the extension's bottom "Connection settings" panel. Extension mode refuses to start without it.

runtime:
  name: mcp2webmcp-extension-demo
  logLevel: info
  # Always-on JSONL at ~/.mcp2webmcp/logs/mcp2webmcp-extension-demo.jsonl unless logPath / MCP2WEBMCP_LOG_PATH is set.

browser:
  adapter: extension
  allowedOrigins: []
  extension:
    host: "127.0.0.1"
    port: 9334

policy:
  # Registration is callable by default. Side Panel choices are persisted here
  # by the Gateway and override these base rules for the exact origin + tool.
  default: deny
  rules: []
  overridesPath: "~/.mcp2webmcp/extension-demo-policy-overrides.json"

consent:
  enabled: true
  autoAdmit: true
  path: "~/.mcp2webmcp/extension-demo-consent.json"

audit:
  enabled: true
  path: "~/.mcp2webmcp/logs/extension-demo-audit.jsonl"
