<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebMCP Gateway extension demo (page-owned host)</title>
  </head>
  <body>
    <h1>extension-demo — page-owned modelContext</h1>
    <p>This page installs its own <code>registerTool</code> host after load.</p>
    <p>Status: <span id="status">registering</span></p>
    <script>
      const statusEl = document.getElementById("status");
      const brand = Symbol.for("mcp2webmcp.webmcp-runtime-polyfill");
      const pageHost = {
        pageOwned: true,
        async registerTool(def) {
          this.def = def;
        },
      };
      document.modelContext = pageHost;
      navigator.modelContext = pageHost;

      const ctx = document.modelContext;
      window.__runtimeProbe = {
        pageOwned: Boolean(ctx && ctx.pageOwned),
        polyfillBrand: Boolean(ctx && ctx[brand]),
      };

      ctx
        .registerTool({
          name: "echo",
          description: "Echo the provided message",
          inputSchema: {
            type: "object",
            properties: { message: { type: "string" } },
            required: ["message"],
          },
          annotations: { readOnlyHint: true, idempotentHint: true },
          execute: async ({ message }) => ({
            content: [{ type: "text", text: `echo:${message}` }],
          }),
        })
        .then(() => {
          statusEl.textContent = "ready";
        })
        .catch((error) => {
          statusEl.textContent = `register-failed:${error}`;
        });
    </script>
  </body>
</html>
